<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>редактирование товара</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <div class="logo">
            <a href="{{ url_for('index') }}">управление товарами</a>
        </div>
        <a class="back" href="{{ url_for('index') }}">назад</a>
    </div>
</header>

<main>
    <div class="container">
        <div class="form-card">
            <p class="subtitle">товары</p>
            <h1>редактирование товара</h1>

            <form method="POST">
                <div class="form-group">
                    <label for="name">название товара</label>
                    <input type="text" id="name" name="name"
                           value="{{ product.name }}" required>
                </div>

                <div class="form-group">
                    <label for="type">тип товара</label>
                    <input type="text" id="type" name="type"
                           value="{{ product.type }}" required>
                </div>

                <div class="form-group">
                    <label for="price">цена</label>
                    <input type="number" id="price" name="price"
                           value="{{ product.price }}" required>
                </div>

                <button class="btn wide" type="submit">сохранить изменения</button>
            </form>
        </div>
    </div>
</main>

</body>
</html>
