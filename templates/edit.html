<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Р11</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <a href="{{ url_for('index') }}">
                товары
            </a>
        </div>
    </div>
</header>


<main>
    <div class="container">

        <h1>Редактирование товара</h1>


        <form class="product-form" method="POST">

            <div class="form-group">
                <label for="name">
                    Название товара
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ product.name }}"
                    required>
            </div>


            <div class="form-group">
                <label for="type">
                    Тип товара
                </label>

                <input
                    type="text"
                    id="type"
                    name="type"
                    value="{{ product.type }}"
                    required>
            </div>


            <div class="form-group">
                <label for="price">
                    цена
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    value="{{ product.price }}"
                    required>
            </div>


            <button class="btn" type="submit">
                сохранить
            </button>

        </form>

    </div>
</main>


</body>
</html>
