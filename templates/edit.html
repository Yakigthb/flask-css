<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование товаров</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="header">
    <div class="container header-inner">
        <div class="logo">
            <a href="{{ url_for('index') }}">ProductManager</a>
        </div>
        <a class="back" href="{{ url_for('index') }}">азад</a>
    </div>
</header>

<main>
    <div class="container">
        <div class="form-card">
            <p class="subtitle">ProductManager</p>
            <h1>Редагування товару</h1>

            <form method="POST">

                <div class="form-group">
                    <label for="name">Назва товару</label>
                    <input type="text" id="name" name="name"
                           value="{{ product.name }}" required>
                </div>

                <div class="form-group">
                    <label for="type">Тип товару</label>
                    <input type="text" id="type" name="type"
                           value="{{ product.type }}" required>
                </div>

                <div class="form-group">
                    <label for="price">Ціна</label>
                    <input type="number" id="price" name="price"
                           value="{{ product.price }}" required>
                </div>

                <button class="btn wide" type="submit">
                    сохранить
                </button>

            </form>
        </div>
    </div>
</main>

</body>
</html>
