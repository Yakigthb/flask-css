<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>управление товарами</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <div class="logo">
            <a href="{{ url_for('index') }}">управление товарами</a>
        </div>
        <a class="btn" href="{{ url_for('add') }}">добавить товар</a>
    </div>
</header>

<main>
    <div class="container">
        <div class="page-title">
            <p class="subtitle">товары</p>
            <h1>список товаров</h1>
        </div>

        <div class="products">
            {% for product in products %}
            <div class="product-card">
                <div>
                    <h2>{{ product.name }}</h2>
                    <p class="type">{{ product.type }}</p>
                    <p class="price">{{ product.price }} гривен</p>
                </div>

                <div class="actions">
                    <a class="btn secondary" href="{{ url_for('edit', name=product.name) }}">редактировать</a>
                    <a class="btn delete" href="{{ url_for('delete', name=product.name) }}">удалить</a>
                </div>
            </div>
            {% else %}
            <div class="empty">
                <h2>товаров пока нет</h2>
                <p>добавьте первый товар</p>
            </div>
            {% endfor %}
        </div>
    </div>
</main>

</body>
</html>
