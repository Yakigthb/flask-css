<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body>
  <header>
    <nav class="navbar bg-dark mb-4" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('products') }}">
          <img src="{{ url_for('static', filename='image/logo.png') }}" style="filter: invert(100%)"
               alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
          <span class="navbar-brand m-1 h1">Product Manager</span>
        </a>

        <!--Кнопки-->
<div>
  <a href="{{ url_for('login') }}" class="btn btn-light" role="button">Login</a>
  <a href="{{ url_for('register') }}" class="btn btn-outline-light" role="button">Register</a>
</div>


      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <h1 class="mb-4">Register</h1>

      <form method="POST">
        <div class="col-md-4 mb-3">
          <input class="form-control" name="name" type="text" placeholder="Name company">
        </div>

        <div class="col-md-4 mb-3">
          <input class="form-control" name="password" type="password" placeholder="Password">
        </div>

        <div class="col-md-4 mb-3">
          <button class="form-control btn btn-dark" type="submit">Register</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
